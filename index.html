<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kizen - Gamified Productivity & Goals</title>
  
  <!-- PWA Metadata -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#080c14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kizen">
  <meta name="description" content="Local-first gamified productivity system with 7 daily pillars, cascading goals, and PC sync.">

  <!-- Self-Healing Cache Watchdog & Recovery -->
  <script>
    window.__kizen_clean_cache = function() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) r.unregister();
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          Promise.all(keys.map(function(k) { return caches.delete(k); })).then(function() {
            window.location.reload(true);
          });
        });
      } else {
        window.location.reload(true);
      }
    };

    window.addEventListener('load', function() {
      setTimeout(function() {
        var daily = document.getElementById('view-daily');
        if (daily && daily.children.length === 0) {
          var fallback = document.getElementById('kizen-fallback-box');
          if (fallback) fallback.style.display = 'block';
        }
      }, 2000);
    });
  </script>

  <!-- Core & Component Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/daily.css">
  <link rel="stylesheet" href="css/goals.css">
  <link rel="stylesheet" href="css/projects.css">
  <link rel="stylesheet" href="css/stats.css">
</head>
<body>

  <!-- Top Sticky Header & Gamification Quick Status -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-section">
        <div class="brand-logo">
          <span>⚡</span>
          <span>Kizen</span>
        </div>
        <span class="brand-badge">PROD v1.0</span>
      </div>

      <div class="header-status-pills">
        <button class="status-pill sync" id="header-sync-pill" title="CouchDB Sync Status">
          🟡 Local Mode
        </button>
        <button class="status-pill streak" id="header-streak-pill" title="Active Streak">
          🔥 0
        </button>
        <button class="status-pill level" id="header-level-pill" title="Current Level & Rank">
          ⭐ LVL 1
        </button>
      </div>
    </div>
  </header>

  <!-- Main View Screens Container -->
  <main class="app-container">
    <!-- Fallback Emergency Banner (visible only if stale/broken JS cache is stuck) -->
    <div id="kizen-fallback-box" style="display: none; padding: 20px; text-align: center; background: rgba(56, 189, 248, 0.08); border: 1px solid var(--color-primary); border-radius: var(--radius-md); margin: 20px 14px;">
      <div style="font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; color: var(--color-primary);">⚡ Nueva Versión de Kizen Disponible</div>
      <p style="font-size: 0.84rem; color: var(--text-secondary); margin-bottom: 16px;">Detectamos una versión previa en la memoria del navegador. Presiona abajo para activar de inmediato el nuevo centro de mando y los 7 pilares.</p>
      <button onclick="window.__kizen_clean_cache()" class="btn btn-primary" style="padding: 10px 20px; font-weight: bold; font-size: 0.9rem;">
        🔄 Actualizar y Recargar Ahora
      </button>
    </div>

    <div id="view-daily" class="view-container active"></div>
    <div id="view-weekly" class="view-container"></div>
    <div id="view-monthly" class="view-container"></div>
    <div id="view-projects" class="view-container"></div>
    <div id="view-journal" class="view-container"></div>
    <div id="view-stats" class="view-container"></div>
  </main>

  <!-- Floating Quick Capture Button -->
  <button class="fab-quick-capture" id="fab-quick-capture" title="Quick Add Task" aria-label="Quick Add Task">
    +
  </button>

  <!-- Bottom Navigation Bar for Mobile & Desktop -->
  <nav class="bottom-nav" role="navigation" aria-label="Main Navigation">
    <button class="nav-item active" data-view="daily" id="nav-btn-daily" aria-label="Daily Command Center">
      <span class="nav-icon">☀️</span>
      <span class="nav-label">Daily</span>
    </button>
    <button class="nav-item" data-view="weekly" id="nav-btn-weekly" aria-label="Weekly Goals">
      <span class="nav-icon">📅</span>
      <span class="nav-label">Weekly</span>
    </button>
    <button class="nav-item" data-view="monthly" id="nav-btn-monthly" aria-label="Monthly Vision">
      <span class="nav-icon">🗓️</span>
      <span class="nav-label">Monthly</span>
    </button>
    <button class="nav-item" data-view="projects" id="nav-btn-projects" aria-label="Projects & Activities">
      <span class="nav-icon">📁</span>
      <span class="nav-label">Projects</span>
    </button>
    <button class="nav-item" data-view="journal" id="nav-btn-journal" aria-label="Journal">
      <span class="nav-icon">📖</span>
      <span class="nav-label">Journal</span>
    </button>
    <button class="nav-item" data-view="stats" id="nav-btn-stats" aria-label="Stats & Analytics">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Stats</span>
    </button>
  </nav>

  <!-- Global Modal Sheet -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content" id="modal-dynamic-content"></div>
  </div>

  <!-- Bundled Offline Libraries & Main Application Script -->
  <script src="js/lib/pouchdb.min.js"></script>
  <script src="js/lib/confetti.browser.min.js"></script>
  <script type="module" src="js/app.js?v=7"></script>
</body>
</html>
